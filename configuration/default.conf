# Cette configuration fonctionne meme aves des commentaires

server
{
    listen 6767;                    
    listen 127.0.0.1:7676;          

    server_name webserver.fr;
    root .;
    error_page 404 html_files/error_page.html;   
    client_max_body_size 10000000;

    location /
    {
        root html_files;
        index index.html;
        accepted_methods GET;
    }
    location /upload/
    {
        accepted_methods GET POST DELETE;
        autoindex off;
    }
    location /configuration/
    {
        accepted_methods GET;
        autoindex on;
    }
    location /kapouet/
    {
        root html_files;
        accepted_methods GET;
        autoindex on;
    }
    location /redirect
    {
        return 302 /get.html;
    }
    location /store/
    {
        accepted_methods POST;
        upload_store upload;
    }
    location .php
    {
        accepted_methods GET POST;
        fast_pass_cgi /usr/bin/php-cgi;
    }
    location .py
    {
        accepted_methods GET POST;
        fast_pass_cgi /usr/bin/python3;
    }
}

server
{
    listen 9998;

    server_name webserver.com;
    root .;
    error_page 500 502 503 504 cgi-bin/error_page.py;   
    client_max_body_size 1000;      
    location /
    {
        root www2;
        index index.html;
        accepted_methods GET;
    }
    location /upload/
    {
        accepted_methods GET POST DELETE;
        autoindex on;
    }
    location .py
    {
        accepted_methods GET POST;
        fast_pass_cgi /usr/bin/python3;
    }
}
