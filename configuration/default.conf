server
{
    listen 6767;
    listen 7676;

    server_name webserver.fr;
    root /home/lfournea/Documents/webserver;
    error_page 404 error_page.py;
    client_max_body_size 10000000;
    location / 
    {
        root /html_files; 
        index index.html;
        accepted_methods GET;
    }
    location /upload
    {
        accepted_methods GET POST DELETE;
        autoindex off;
    }
    location /configuration
    {
        accepted_methods GET POST DELETE;
        autoindex on;
    }
    location .php
    {
        accepted_methods GET POST;
        fast_pass_cgi /usr/bin/php-cgi;
    }
    location .py
    {
        accepted_methods GET POST;
        fast_pass_cgi /usr/bin/python3;
    }
}

