<!DOCTYPE html>
<html lang="fr">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 Not Found</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, Helvetica, sans-serif;
            background: #f4f4f4;
            color: #333;
            text-align: center;
        }
        h1 {
            font-size: 6em;
            margin: 0;
            color: #c0392b;
        }

            margin: 0.2em 0 0.8em;

        }
        a {
            color: #2c3e50;
        }
        hr {
            border: none;
            border-top: 1px solid #ccc;

        }

            color: #888;
        }

<body>
    <div>

        <p><a href="/">Retour à l'accueil</a></p>

        <small>webserv</small>
